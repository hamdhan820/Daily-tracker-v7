function toggleAmbient(){if(focusState.audio){focusState.audio.close();focusState.audio=null;focusState.ambient=false;const b=$('#focusScreen button[onclick="toggleAmbient()"]');if(b)b.textContent='🌧 Rain sound: Off';return}try{const C=window.AudioContext||window.webkitAudioContext;if(!C){alert('Ambient audio is not supported on this device.');return}const ctx=new C(),buffer=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*.25;const src=ctx.createBufferSource();src.buffer=buffer;src.loop=true;const filter=ctx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=900;const gain=ctx.createGain();gain.gain.value=.08;src.connect(filter);filter.connect(gain);gain.connect(ctx.destination);src.start();focusState.audio=ctx;focusState.ambient=true;const b=$('#focusScreen button[onclick="toggleAmbient()"]');if(b)b.textContent='🌧 Rain sound: On';}catch(e){alert('Could not start ambient sound.')}}

async function nativeSync(ask){
 if(!isNative)return;
 const C=window.Capacitor, alarm=C&&C.Plugins&&C.Plugins.DailyAlarm;
 try{
  if(!alarm||typeof alarm.schedule!=='function')throw new Error('The native prayer-alarm plugin is not available in this build.');
  if(ask){
   try{if(typeof alarm.allowExact==='function')await alarm.allowExact()}catch(e){}
   try{if(typeof alarm.allowFullScreen==='function')await alarm.allowFullScreen()}catch(e){}
  }
  const list=[],now=Date.now(),t0=ymd(new Date());let id=1;
  for(let i=0;i<7;i++){
   const d=pd(t0);d.setDate(d.getDate()+i);const dt=ymd(d);
   items(dt).forEach(x=>{
    const a=x.a;
    if(a.cat!=='prayer'||String(a.name||'').trim().toLowerCase()==='sunrise'||['done','late','skip','miss','resched'].includes(x.r.st))return;
    const parts=String(x.s||'').split(':').map(Number);if(parts.length!==2||!Number.isFinite(parts[0])||!Number.isFinite(parts[1]))return;
    const at=new Date(d.getFullYear(),d.getMonth(),d.getDate(),parts[0],parts[1],0,0).getTime();
    if(at<=now)return;
    list.push({id:id++,at,k:0,t:'🕌 '+(x.r.rn||a.name),b:(x.r.rn||a.name)+' prayer time.'});
   });
  }
  await alarm.schedule({items:list});
  if(ask)alert(list.length+' prayer-time alarms scheduled for the next 7 days.');
 }catch(e){if(ask)alert('Could not set prayer alarms: '+(e&&e.message||e));}
}

function calc(date,lat,lng,mk,hf){
 const jd=Date.UTC(date.getFullYear(),date.getMonth(),date.getDate())/864e5+2440587.5-lng/360,D=jd-2451545,g=(357.529+0.98560028*D)%360,q=(280.459+0.98564736*D)%360,

 const m=PM[mk]||PM.mwl,asrA=-Math.atan(1/((hf?2:1)+Math.tan(rd(Math.abs(lat-dec)))))*180/Math.PI,ss=A(0.833,false);
 const o={Fajr:A(m[1],true),Sunrise:A(0.833,true),Dhuhr:noon+2/60,Asr:A(asrA,false),Maghrib:ss,Isha:m[2]==='90'?ss+1.5:A(m[2],false)};
 for(const k in o){const v=o[k];o[k]=isNaN(v)?'':pad(Math.floor(Math.round(fh(v)*60)%1440/60))+':'+pad(Math.round(fh(v)*60)%60)}return o}

 for(const k of ['Fajr','Dhuhr','Asr','Maghrib','Isha'])if(t[k]&&mm(t[k])>nowM)return{name:k,time:t[k],left:(mm(t[k])-nowM)*60};
 const tm=times(new Date(n.getTime()+864e5));return tm&&tm.Fajr?{name:'Fajr',time:tm.Fajr,left:(1440+mm(tm.Fajr)-nowM)*60}:null}

 $('#sgGo').onclick=()=>{w.remove();startStudyFocus(x.a.id,today)};$('#sgLater').onclick=()=>{w.remove();setTimeout(()=>{delete window._sgSeen[today+x.a.id]},3e5)}}

applyTheme();render();

<script>
/* Daily Routine Tracker v3 enhancements — secure OpenAI gateway, countdowns, focus research and updates. */
const DRT_VERSION = '3.3.0';
if(S.set.autoPlan===undefined){S.set.autoPlan=false;save()}
// Remove legacy provider API keys that the previous version stored on-device.
if(S.set.gKey||S.set.aiKey){delete S.set.gKey;delete S.set.aiKey;delete S.set.aiModel;delete S.set.gModel;delete S.set.aiProv;save()}
const DRT_API_DEFAULT = '';
function drtEndpoint(){return String(S.set.openAiEndpoint||DRT_API_DEFAULT||'').trim().replace(/\/+$/,'')}
function drtDateDiff(date){const a=new Date();a.setHours(0,0,0,0);const b=new Date(date+'T00:00:00');return Math.ceil((b-a)/86400000)}
function drtEscapeUrl(url){try{const u=new URL(url);return u.protocol==='https:'?u.href:''}catch(e){return ''}}
function drtOpenUrl(url){const safe=drtEscapeUrl(url);if(!safe)return;const plugins=window.Capacitor&&window.Capacitor.Plugins||{};if(plugins.FocusBlocking&&plugins.FocusBlocking.unpinScreen)plugins.FocusBlocking.unpinScreen().catch(()=>{});const browser=plugins.Browser;if(browser&&browser.open){browser.open({url:safe}).catch(()=>window.open(safe,'_blank','noopener'));}else window.open(safe,'_blank','noopener')}

function drtCountdownMarkup(){
  const exams=(S.set.exams||[]).filter(e=>e.date&&drtDateDiff(e.date)>=0).sort((a,b)=>a.date.localeCompare(b.date));
  const achievement=S.set.achievement&&S.set.achievement.date&&drtDateDiff(S.set.achievement.date)>=0?S.set.achievement:null;
  let html='';
  if(exams.length){const e=exams[0];html+='<section class="exam-countdown"><div class="countdown-kicker">NEXT EXAM · COUNTDOWN</div><div class="countdown-number" data-countdown-target="'+new Date(e.date+'T00:00:00').getTime()+'">'+drtDateDiff(e.date)+'</div><div class="countdown-unit">DAYS REMAINING</div><div class="countdown-title">'+esc(e.subject)+'</div><div class="countdown-meta">'+new Date(e.date+'T00:00:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</div><div class="countdown-tools"><button class="b" onclick="tab(\'study\')">Open timetable</button><button class="b" onclick="examAdd()">Add another exam</button></div></section>'}
  if(achievement){html+='<section class="exam-countdown"><div class="countdown-kicker">YOUR NEXT ACHIEVEMENT</div><div class="countdown-number" data-countdown-target="'+new Date(achievement.date+'T00:00:00').getTime()+'">'+drtDateDiff(achievement.date)+'</div><div class="countdown-unit">DAYS TO GO</div><div class="countdown-title">'+esc(achievement.title)+'</div><div class="countdown-meta">'+new Date(achievement.date+'T00:00:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</div><div class="countdown-tools"><button class="b" onclick="drtAchievementEdit()">Edit achievement</button><button class="b" onclick="drtAchievementRemove()">Remove</button></div></section>'}
  else{html+='<section class="exam-countdown"><div class="countdown-kicker">PERSONAL MILESTONE</div><div class="countdown-title">Give your next achievement a date.</div><div class="countdown-meta">Create a large live countdown for a goal, result day or important event.</div><div class="countdown-tools"><button class="b p" onclick="drtAchievementEdit()">＋ Set achievement countdown</button></div></section>'}
  return html;
}
function drtUpdateCountdowns(){document.querySelectorAll('[data-countdown-target]').forEach(el=>{const ms=Math.max(0,Number(el.dataset.countdownTarget)-Date.now());const days=Math.ceil(ms/86400000);el.textContent=String(days);});}
const drtOriginalProfileCard=profileCard;
profileCard=function(){return drtOriginalProfileCard()+drtCountdownMarkup()};
setInterval(drtUpdateCountdowns,60000);
window.drtAchievementEdit=function(){const a=S.set.achievement||{};modal('Achievement countdown',[{k:'title',l:'What are you working towards?',v:a.title||''},{k:'date',l:'Achievement date',t:'date',v:a.date||ymd(new Date(Date.now()+30*86400000))}],v=>{if(!v.title.trim()||!v.date||v.date<today){alert('Enter an achievement and a date today or later.');return false}S.set.achievement={title:v.title.trim(),date:v.date};save();render()},'Save countdown')};
window.drtAchievementRemove=function(){if(confirm('Remove this achievement countdown?')){delete S.set.achievement;save();render()}};

function drtChatHistory(){S.set.openAiHistory=Array.isArray(S.set.openAiHistory)?S.set.openAiHistory:[];return S.set.openAiHistory}
function drtRenderMessages(){const host=document.getElementById('openAiMessages');if(!host)return;const history=drtChatHistory();host.innerHTML=history.length?history.map(m=>'<div class="ai-msg '+(m.role==='user'?'user':'assistant')+'"><div class="role">'+(m.role==='user'?'YOU':'OPENAI STUDY ASSISTANT')+'</div><div>'+esc(m.content||'')+'</div>'+(m.sources&&m.sources.length?'<div class="ai-sources">'+m.sources.map((x,i)=>{const u=drtEscapeUrl(x.url);return u?'<a href="'+u+'" target="_blank" rel="noopener">'+esc(x.title||('Source '+(i+1)))+'</a>':''}).join('')+'</div>':'')+'</div>').join(''):'<div class="ai-msg assistant"><div class="role">OPENAI STUDY ASSISTANT</div>Ask a question, upload or paste notes, or switch on web research for current sources.</div>';host.scrollTop=host.scrollHeight}
window.drtSaveEndpoint=function(){const v=(document.getElementById('drtEndpoint')||{}).value||'';const u=v.trim().replace(/\/+$/,'');if(u&&!/^https:\/\//i.test(u)){alert('Use your secure HTTPS Worker URL.');return}S.set.openAiEndpoint=u;save();alert(u?'Secure AI service address saved.':'AI service address cleared.');render()};
window.drtClearChat=function(){if(confirm('Clear this device’s AI chat history?')){S.set.openAiHistory=[];save();render()}};
window.drtChatSend=async function(){const input=document.getElementById('openAiPrompt'),btn=document.getElementById('drtSend');if(!input)return;const message=input.value.trim();if(!message)return;const endpoint=drtEndpoint();if(!endpoint){alert('First deploy the secure OpenAI Worker and save its HTTPS URL in Settings.');return}const research=!!(document.getElementById('drtResearch')||{}).checked;const history=drtChatHistory().slice(-12).map(x=>({role:x.role,content:x.content}));drtChatHistory().push({role:'user',content:message});input.value='';if(btn){btn.disabled=true;btn.textContent='Thinking…'}drtRenderMessages();
 try{const r=await fetch(endpoint+'/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message,history,research,context:'You are the Daily Routine Tracker study assistant. Be accurate, supportive and concise for a student using a phone. Explain step by step when asked. Do not invent sources or claim to have searched unless web search was enabled and used.'})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('AI service returned '+r.status));drtChatHistory().push({role:'assistant',content:j.text||'No text response was returned.',sources:Array.isArray(j.sources)?j.sources:[]});save();drtRenderMessages();}
 catch(e){drtChatHistory().push({role:'assistant',content:'I could not connect to the AI service. '+(e.message||String(e))+'\nCheck the Worker URL, internet connection and OpenAI billing/API key setup.'});save();drtRenderMessages()}
 finally{if(btn){btn.disabled=false;btn.textContent='Send'}input.focus()}};
window.drtQuick=function(prefix){const input=document.getElementById('openAiPrompt');if(input){input.value=prefix;input.focus()}};
window.aiView=function(){const endpoint=drtEndpoint();return '<section class="ai-shell"><header class="ai-head"><div class="eyebrow">OPENAI · STUDY INTELLIGENCE</div><h1>Study with clarity.</h1><p class="sub">Ask questions, understand difficult topics and research with sources.</p><div class="acts"><button class="b" onclick="tab(\'study\')">Timetable</button><button class="b" onclick="startFocus()">Start focus</button><button class="b" onclick="drtClearChat()">Clear conversation</button></div></header><div class="ai-quick"><button class="b" onclick="drtQuick(&quot;Explain this lesson step by step with an example and a short recap: &quot;)">Explain lesson</button><button class="b" onclick="drtQuick(&quot;Solve this question step by step and show the working: &quot;)">Solve question</button><button class="b" onclick="drtQuick(&quot;Summarise these notes into exam revision points: &quot;)">Summarise notes</button><button class="b" onclick="drtQuick(&quot;Create a realistic study plan for these subjects and dates: &quot;)">Study plan</button></div><div class="ai-config"><label>Secure AI service URL</label><input id="drtEndpoint" type="url" value="'+esc(endpoint)+'" placeholder="https://your-worker.workers.dev"><div class="acts"><button class="b" onclick="drtSaveEndpoint()">Save service URL</button></div><div class="sub">Your OpenAI API key belongs on the secure server, never in this app.</div></div><div id="openAiMessages" class="ai-messages"></div><div class="ai-compose"><label class="ai-research"><input id="drtResearch" type="checkbox"> Search the web for current study research and show sources</label><textarea id="openAiPrompt" placeholder="Ask ChatGPT about a lesson, question or study topic…" onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();drtChatSend()}"></textarea><div class="acts"><button id="drtSend" class="b p" onclick="drtChatSend()">Send</button><button class="b" onclick="drtOpenUrl(\'https://chatgpt.com\')">Open ChatGPT</button></div></div></section>'};
window.tutorView=window.aiView;
window.tutorGo=async function(mode){const q=(document.getElementById('tq')||{}).value||'';if(!q.trim())return;const endpoint=drtEndpoint();if(!endpoint){alert('Set the secure OpenAI Worker URL in Settings first.');return}const instructions={explain:'Explain this topic step by step with one simple example and a short recap.',quiz:'Create five multiple-choice revision questions and provide the answers after the questions.',sum:'Summarise these notes into concise revision bullets and three likely exam questions.',plan:'Create a realistic revision plan based on the information supplied.'}[mode]||'Help the student learn this topic.';const out=document.getElementById('tout');if(out)out.textContent='Thinking…';try{const r=await fetch(endpoint+'/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:q,history:[],research:mode==='plan',context:instructions})});const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);if(out)out.textContent=j.text||'No response.'}catch(e){if(out)out.textContent='Could not reach OpenAI: '+e.message}};

/* Research apps are allowed only while the focus timer is active. */
const drtOriginalShowFocus=showFocus;
showFocus=function(){drtOriginalShowFocus();const host=document.getElementById('focusScreen');if(!host)return;const panel=document.createElement('div');panel.className='focus-research';panel.innerHTML='<button type="button" onclick="drtOpenUrl(\'https://chatgpt.com\')">✦ Open ChatGPT</button><button type="button" onclick="drtToggleFocusAI()">Ask AI here</button><button type="button" onclick="drtOpenUrl(\'https://www.google.com/search?q=study+research\')">⌕ Web research</button><div id="focusAiPanel" hidden><textarea id="focusAiPrompt" placeholder="Ask a study question…"></textarea><label style="display:flex;gap:7px;align-items:center;justify-content:center"><input id="focusAiResearch" type="checkbox" style="width:auto"> Search web sources</label><button type="button" onclick="drtFocusAsk()">Ask OpenAI</button><div id="focusAiResult" class="focus-ai-result"></div></div>';host.appendChild(panel)};
window.drtToggleFocusAI=function(){const p=document.getElementById('focusAiPanel');if(p)p.hidden=!p.hidden};
window.drtFocusAsk=async function(){const input=document.getElementById('focusAiPrompt'),out=document.getElementById('focusAiResult');if(!input||!out)return;const message=input.value.trim(),endpoint=drtEndpoint();if(!message)return;if(!endpoint){out.textContent='Set the secure OpenAI Worker URL in Settings first.';return}out.textContent='Thinking…';try{const history=drtChatHistory().slice(-8).map(x=>({role:x.role,content:x.content}));const research=!!document.getElementById('focusAiResearch')?.checked;const r=await fetch(endpoint+'/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message,history,research,context:'Answer briefly for a student in an active focus session. Give a clear explanation and do not invent sources.'})});const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);out.textContent=j.text||'No response.';drtChatHistory().push({role:'user',content:message},{role:'assistant',content:j.text||'',sources:j.sources||[]});save();input.value=''}catch(e){out.textContent='Could not reach OpenAI: '+e.message}};

/* Android can leave the tracker for ChatGPT or a research browser during focus. */
window.drtCheckUpdate=async function(show){const endpoint=drtEndpoint(),status=document.getElementById('drtUpdateStatus');if(!endpoint){if(status)status.textContent='Set the secure service URL to enable update checks.';return}if(status)status.textContent='Checking for updates…';try{const r=await fetch(endpoint+'/api/version',{cache:'no-store'});if(!r.ok)throw new Error('Update service returned '+r.status);const v=await r.json();const newer=String(v.version||'0').localeCompare(DRT_VERSION,undefined,{numeric:true,sensitivity:'base'})>0;let message='You are using version '+DRT_VERSION+'.';if(newer){message='Version '+v.version+' is available.';const url=drtEscapeUrl((window.Capacitor&&window.Capacitor.getPlatform&&window.Capacitor.getPlatform()==='ios')?v.iosUrl:v.androidUrl);if(url)message+=' Tap the update link below.';if(status){status.innerHTML=esc(message)+(url?' <a href="'+url+'" target="_blank" rel="noopener">Get update</a>':'')+'<div class="sub">Android installation requires your approval. iOS updates must be installed through Apple distribution.</div>';return}else{let banner=document.getElementById('drtUpdateBanner');if(!banner){banner=document.createElement('div');banner.id='drtUpdateBanner';banner.className='drt-update-banner';document.body.appendChild(banner)}banner.innerHTML='<b>'+esc(message)+'</b>'+(url?' <a href="'+url+'" target="_blank" rel="noopener">Get update</a>':'')+'<button aria-label="Dismiss" onclick="this.parentElement.remove()">×</button>';return}}if(status)status.textContent=message;else if(show)alert(message)}catch(e){if(status)status.textContent='Update check unavailable: '+e.message;else if(show)alert('Update check unavailable: '+e.message)}};
const drtOldSettings=settings;
settings=function(){return drtOldSettings()+'<div class="card"><h2>OpenAI & app updates</h2><div class="sub">Configure the secure OpenAI gateway URL once. The same service checks for app updates.</div><label>Secure Worker URL<input id="drtEndpoint" type="url" value="'+esc(drtEndpoint())+'" placeholder="https://your-worker.workers.dev"></label><div class="acts"><button class="b p" onclick="drtSaveEndpoint()">Save service URL</button><button class="b" onclick="drtCheckUpdate(true)">Check for updates</button></div><div id="drtUpdateStatus" class="update-line"></div><div class="sub">Updates are detected automatically when the app can reach your update service. Android will ask you to approve APK installation; iOS uses App Store/TestFlight.</div></div>'};
setTimeout(()=>{if(drtEndpoint())drtCheckUpdate(false)},4500);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&focusState&&focusState.running&&document.getElementById('focusScreen')){const p=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.FocusBlocking;if(p&&p.pinScreen)setTimeout(()=>p.pinScreen().catch(()=>{}),700)}});
setTimeout(drtUpdateCountdowns,100);

// Restore the saved conversation whenever the AI tab is opened.
const drtBaseRender=render;render=function(){drtBaseRender();if(view==='ai'||view==='tutor')setTimeout(drtRenderMessages,0)};
// Re-render once so the new dashboard and AI screen are active immediately.
render();

</script>
