name: Build signed release APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Check signing secret exists
        env:
          SK: ${{ secrets.SIGNING_KEY }}
        run: |
          SK=$(printf '%s' "$SK" | tr -d '\n\r ')
          case "$SK" in *:*) ;; *) echo "Missing or wrong secret SIGNING_KEY (format: KEYSTORE_BASE64:PASSWORD)"; exit 1;; esac
      - run: npm install
      - run: mkdir -p www && cp index.html sw.js manifest.webmanifest icon-192.png icon-512.png www/
      - run: npx cap add android
      - name: Icons and alarm code
        run: |
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for p in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${p%%:*}; s=${p##*:}; mkdir -p $R/mipmap-$d
            cp ic_$s.png $R/mipmap-$d/ic_launcher.png
            cp ic_$s.png $R/mipmap-$d/ic_launcher_round.png
          done
          J=android/app/src/main/java/com/mydaily/tracker
          mkdir -p $J
          cp AlarmPlugin.java AlarmReceiver.java AlarmActivity.java MainActivity.java $J/
          python3 patch_manifest.py
      - run: npx cap sync android
      - name: Verify exact alarm permissions
        run: grep -q USE_EXACT_ALARM android/app/src/main/AndroidManifest.xml && grep -q SCHEDULE_EXACT_ALARM android/app/src/main/AndroidManifest.xml
      - name: Set version
        run: |
          G=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" $G
          grep -E "versionCode|versionName" $G
      - name: Build release (unsigned)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Align and sign
        env:
          SK: ${{ secrets.SIGNING_KEY }}
        run: |
          set -e
          SK=$(printf '%s' "$SK" | tr -d '\n\r ')
          KS_B64="${SK%%:*}"
          export KEY_PASSWORD="${SK#*:}"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          IN=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          $BT/zipalign -p -f 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          mkdir -p out
          $BT/apksigner sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias tracker \
            --ks-pass env:KEY_PASSWORD --key-pass env:KEY_PASSWORD \
            --out out/MyDailyTracker.apk "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/release.jks"
          $BT/apksigner verify --verbose --print-certs out/MyDailyTracker.apk
          if $BT/aapt2 dump badging out/MyDailyTracker.apk | grep -q "application-debuggable"; then
            echo "ERROR: APK is still debuggable"; exit 1
          fi
          echo "OK: signed, release (not debuggable)"
      - uses: actions/upload-artifact@v4
        with:
          name: MyDailyTracker-signed-release
          path: out/MyDailyTracker.apk
          retention-days: 30
